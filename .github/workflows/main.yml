name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ============================================================
      # RDP + AUDIO CONFIGURATION
      # ============================================================

      - name: Configure Core RDP Settings
        shell: powershell
        run: |

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # RDP authentication settings
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # ========================================================
          # RDP AUDIO PLAYBACK
          # ========================================================

          $tsPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'

          if (-not (Test-Path $tsPolicy)) {
              New-Item -Path $tsPolicy -Force | Out-Null
          }

          # Enable audio playback through RDP
          New-ItemProperty `
            -Path $tsPolicy `
            -Name "fDisableAudioPlayback" `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          # Enable microphone/audio capture through RDP
          New-ItemProperty `
            -Path $tsPolicy `
            -Name "fDisableAudioCapture" `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          # ========================================================
          # WINDOWS AUDIO SERVICES
          # ========================================================

          Set-Service `
            -Name "Audiosrv" `
            -StartupType Automatic

          Start-Service `
            -Name "Audiosrv" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "AudioEndpointBuilder" `
            -StartupType Automatic

          Start-Service `
            -Name "AudioEndpointBuilder" `
            -ErrorAction SilentlyContinue

          # ========================================================
          # FIREWALL
          # ========================================================

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart RDP service
          Restart-Service `
            -Name TermService `
            -Force

          Write-Host "RDP enabled."
          Write-Host "RDP audio playback enabled."
          Write-Host "RDP microphone redirection enabled."
          Write-Host "Windows Audio services enabled."


      # ============================================================
      # CREATE RDP USER
      # ============================================================

      - name: Create RDP User with Secure Password
        shell: powershell
        run: |

          Add-Type -AssemblyName System.Security

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = (
                  [char[]](33..47) +
                  [char[]](58..64) +
                  [char[]](91..96) +
                  [char[]](123..126)
              )
          }

          $rawPassword = @()

          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed."
              exit 1
          }

          Write-Host "RDP user created successfully."


      # ============================================================
      # INSTALL TAILSCALE
      # ============================================================

      - name: Install Tailscale
        shell: powershell
        run: |

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installerPath `
            -Force

          Write-Host "Tailscale installed successfully."


      # ============================================================
      # CONNECT TAILSCALE
      # ============================================================

      - name: Establish Tailscale Connection
        shell: powershell
        run: |

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {

              $tsIP = (& $tailscale ip -4 | Select-Object -First 1).Trim()

              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"


      # ============================================================
      # INSTALL ANYDESK
      # ============================================================

      - name: Install AnyDesk
        shell: powershell
        run: |

          Write-Host "Installing AnyDesk..."

          winget install `
            --id AnyDeskSoftwareGmbH.AnyDesk `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          if ($LASTEXITCODE -ne 0) {
              Write-Error "AnyDesk installation failed."
              exit 1
          }

          Write-Host "AnyDesk installed successfully."


      # ============================================================
      # INSTALL VISUAL STUDIO CODE
      # ============================================================

      - name: Install Visual Studio Code
        shell: powershell
        run: |

          Write-Host "Installing Visual Studio Code..."

          winget install `
            --id Microsoft.VisualStudioCode `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Visual Studio Code installation failed."
              exit 1
          }

          Write-Host "Visual Studio Code installed successfully."


      # ============================================================
      # INSTALL OBS STUDIO
      # ============================================================

      - name: Install OBS Studio
        shell: powershell
        run: |

          Write-Host "Installing OBS Studio..."

          winget install `
            --id OBSProject.OBSStudio `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          if ($LASTEXITCODE -ne 0) {
              Write-Error "OBS Studio installation failed."
              exit 1
          }

          Write-Host "OBS Studio installed successfully."


      # ============================================================
      # VERIFY RDP
      # ============================================================

      - name: Verify RDP Accessibility
        shell: powershell
        run: |

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }

          Write-Host "TCP connectivity successful."


      # ============================================================
      # SHOW ACCESS INFORMATION + KEEP RUNNER ALIVE
      # ============================================================

      - name: Maintain Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             RDP ACCESS"
          Write-Host "=========================================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_CREDS"
          Write-Host ""
          Write-Host "Installed:"
          Write-Host " - Tailscale"
          Write-Host " - AnyDesk"
          Write-Host " - Visual Studio Code"
          Write-Host " - OBS Studio"
          Write-Host " - RDP Audio"
          Write-Host "=========================================="
          Write-Host ""

          while ($true) {

              Write-Host "[$(Get-Date)] RDP Active"

              Start-Sleep -Seconds 300
          }
