name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      # ============================================================
      # 1. Configure RDP + AUDIO
      # ============================================================
      - name: Configure RDP and Audio
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Configuring Remote Desktop ==="

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Keep the same connection settings as your original workflow
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 0 `
            -Force

          # ========================================================
          # AUDIO REDIRECTION
          # ========================================================

          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          $rdpTcpPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          # Create policy key if it does not exist
          if (-not (Test-Path $policyPath)) {
              New-Item -Path $policyPath -Force | Out-Null
          }

          # Allow remote audio playback
          New-ItemProperty `
            -Path $policyPath `
            -Name 'fDisableAudio' `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          # Allow audio recording / microphone redirection
          New-ItemProperty `
            -Path $policyPath `
            -Name 'fDisableAudioCapture' `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          # Also explicitly allow audio on the RDP-Tcp listener
          New-ItemProperty `
            -Path $rdpTcpPath `
            -Name 'fDisableAudio' `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          New-ItemProperty `
            -Path $rdpTcpPath `
            -Name 'fDisableAudioCapture' `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          Write-Host "RDP audio redirection registry settings applied."

          # ========================================================
          # WINDOWS AUDIO SERVICES
          # ========================================================

          # Windows Audio Endpoint Builder
          Set-Service `
            -Name 'AudioEndpointBuilder' `
            -StartupType Automatic

          # Windows Audio
          Set-Service `
            -Name 'Audiosrv' `
            -StartupType Automatic

          # Start Audio Endpoint Builder first
          Start-Service `
            -Name 'AudioEndpointBuilder' `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          # Start Windows Audio
          Start-Service `
            -Name 'Audiosrv' `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          # Make sure both services are actually running
          $audioEndpoint = Get-Service -Name 'AudioEndpointBuilder'
          $audioService = Get-Service -Name 'Audiosrv'

          Write-Host "AudioEndpointBuilder status: $($audioEndpoint.Status)"
          Write-Host "Windows Audio status: $($audioService.Status)"

          if ($audioEndpoint.Status -ne 'Running') {
              Write-Error "AudioEndpointBuilder is not running."
              exit 1
          }

          if ($audioService.Status -ne 'Running') {
              Write-Error "Windows Audio service is not running."
              exit 1
          }

          # Refresh Group Policy
          Write-Host "Refreshing Group Policy..."
          gpupdate.exe /force | Out-Host

          # Remove duplicate firewall rule if it exists
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null

          # Temporary rule.
          # It will be restricted to the Tailscale IP after Tailscale starts.
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 | Out-Null

          Write-Host "RDP configuration completed."

          # Restart RDP service after configuration
          Restart-Service -Name 'TermService' -Force

          Start-Sleep -Seconds 5

          Write-Host "Remote Desktop service restarted successfully."

      # ============================================================
      # 2. Create RDP User
      # ============================================================
      - name: Create RDP User with Secure Password
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Creating RDP User ==="

          Add-Type -AssemblyName System.Security

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = (
                  [char[]](33..47) +
                  [char[]](58..64) +
                  [char[]](91..96) +
                  [char[]](123..126)
              )
          }

          $rawPassword = @()

          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Create the account
          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires:$true `
            -Description "RDP access account"

          # Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          # Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          # Verify user creation
          $rdpUser = Get-LocalUser -Name "RDP"

          if (-not $rdpUser) {
              Write-Error "RDP user creation failed."
              exit 1
          }

          # Store credentials in environment
          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP user created successfully."
          Write-Host "Username: RDP"
          Write-Host "Password: $password"

      # ============================================================
      # 3. Install Tailscale
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Installing Tailscale ==="

          $tsVersion = "1.102.4"
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-$tsVersion-amd64.msi"
          $installerPath = "$env:TEMP\tailscale-$tsVersion.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          if (-not (Test-Path $installerPath)) {
              Write-Error "Tailscale installer was not downloaded."
              exit 1
          }

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
                "/i",
                "`"$installerPath`"",
                "/quiet",
                "/norestart"
            ) `
            -Wait

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          Write-Host "Tailscale installed successfully."
          & $tailscaleExe version

      # ============================================================
      # 4. Establish Tailscale
      # ============================================================
      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Starting Tailscale ==="

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscaleExe up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          Write-Host "Waiting for Tailscale IPv4..."

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 20) {

              $tsIP = (& $tailscaleExe ip -4 2>$null | Select-Object -First 1).Trim()

              if ($tsIP) {
                  break
              }

              Start-Sleep -Seconds 3
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IPv4 address was not assigned."
              exit 1
          }

          Write-Host "Tailscale IP: $tsIP"

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          # ========================================================
          # Restrict RDP firewall access to Tailscale only
          # ========================================================

          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip="$tsIP" | Out-Null

          Write-Host "RDP firewall rule restricted to Tailscale IP."

      # ============================================================
      # 5. Verify RDP + Audio Configuration
      # ============================================================
      - name: Verify RDP and Audio Configuration
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Verification ==="

          # Check RDP enabled
          $rdpDenied = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections'

          if ($rdpDenied -ne 0) {
              Write-Error "RDP is not enabled."
              exit 1
          }

          # Check audio policy
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'

          $audioPolicy = Get-ItemPropertyValue `
            -Path $policyPath `
            -Name 'fDisableAudio' `
            -ErrorAction Stop

          $capturePolicy = Get-ItemPropertyValue `
            -Path $policyPath `
            -Name 'fDisableAudioCapture' `
            -ErrorAction Stop

          Write-Host "fDisableAudio: $audioPolicy"
          Write-Host "fDisableAudioCapture: $capturePolicy"

          if ($audioPolicy -ne 0) {
              Write-Error "RDP audio playback redirection is disabled."
              exit 1
          }

          if ($capturePolicy -ne 0) {
              Write-Error "RDP audio capture redirection is disabled."
              exit 1
          }

          # Check Windows Audio
          $audioSvc = Get-Service -Name 'Audiosrv'
          $endpointSvc = Get-Service -Name 'AudioEndpointBuilder'

          Write-Host "Windows Audio: $($audioSvc.Status)"
          Write-Host "Audio Endpoint Builder: $($endpointSvc.Status)"

          if ($audioSvc.Status -ne 'Running') {
              Write-Error "Windows Audio service is not running."
              exit 1
          }

          if ($endpointSvc.Status -ne 'Running') {
              Write-Error "Audio Endpoint Builder is not running."
              exit 1
          }

          # Check RDP service
          $termService = Get-Service -Name 'TermService'

          Write-Host "TermService: $($termService.Status)"

          if ($termService.Status -ne 'Running') {
              Write-Error "Remote Desktop Service is not running."
              exit 1
          }

          # Check port 3389
          Write-Host "Checking local RDP port 3389..."

          $portCheck = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $portCheck.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not listening."
              exit 1
          }

          Write-Host "RDP port 3389 is listening."

          # Check Tailscale connectivity to the RDP port
          Write-Host "Checking Tailscale RDP connectivity..."

          $tsCheck = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $tsCheck.TcpTestSucceeded) {
              Write-Error "RDP is not reachable through Tailscale."
              exit 1
          }

          Write-Host "Tailscale -> RDP TCP connectivity successful."

          Write-Host ""
          Write-Host "=== AUDIO CONFIGURATION OK ==="
          Write-Host "RDP audio playback redirection: ENABLED"
          Write-Host "RDP audio capture redirection: ENABLED"
          Write-Host "Windows Audio service: RUNNING"
          Write-Host "Audio Endpoint Builder: RUNNING"
          Write-Host "=============================="

      # ============================================================
      # 6. Maintain Connection
      # ============================================================
      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             RDP ACCESS"
          Write-Host "=========================================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Audio redirection has been configured."
          Write-Host "In your RDP client, select:"
          Write-Host "Play remote sound on this device."
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active"
              Start-Sleep -Seconds 300
          }
